[package]
name = "unsplash-mcp"
version = "2.0.0"
edition = "2021"
description = "MCP server for Unsplash image discovery via headless Chrome (Anubis-resistant)"
license = "MIT"

[[bin]]
name = "unsplash-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
chromiumoxide = "0.9"
url = "2"
